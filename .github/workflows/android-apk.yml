# Pravi Android aplikaciju posle svake izmene: APK (za probu na telefonu) i AAB (za Google Play).
# Preuzimanje: GitHub → Actions → poslednje "Android APK" pokretanje → Artifacts → 25slova-apk / 25slova-aab
# Potpisivanje: GitHub → Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Bez njih se potpisuje probnim (debug) ključem.
name: Android APK

on:
  push:
    branches: [claude/mobile-game-serbian-a6err7]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Ključ za potpisivanje
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Potpisuje se ključem za Google Play."
          else
            echo "::warning::Nema ključa (ANDROID_KEYSTORE_BASE64) — potpisuje se probnim ključem."
          fi
      # Broj verzije raste sa svakim pokretanjem (Google Play traži veći broj za svaku novu verziju).
      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Preimenuj
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/25slova.apk
          cp build/app/outputs/bundle/release/app-release.aab build/25slova.aab
      - uses: actions/upload-artifact@v4
        with:
          name: 25slova-apk
          path: mobile/build/25slova.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: 25slova-aab
          path: mobile/build/25slova.aab
          retention-days: 30
