# Pravi Android aplikaciju posle svake izmene: APK (za probu na telefonu) i AAB (za Google Play).
# Preuzimanje: GitHub → Actions → poslednje "Android APK" pokretanje → Artifacts → 25slova-apk / 25slova-aab
# Potpisivanje: GitHub → Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Bez njih se potpisuje probnim (debug) ključem.
name: Android APK

on:
  push:
    branches: [claude/mobile-game-serbian-a6err7]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Ključ za potpisivanje
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Nema ključa (ANDROID_KEYSTORE_BASE64) — potpisuje se probnim ključem."
            exit 0
          fi
          # Razmaci i novi redovi koji se slučajno nalepe pri kopiranju se uklanjaju.
          clean() { printf %s "$1" | tr -d ' \r\n\t'; }
          KS_PASS=$(clean "$KS_PASS"); KEY_PASS=$(clean "$KEY_PASS"); KEY_ALIAS=$(clean "$KEY_ALIAS")
          [ -z "$KEY_PASS" ] && KEY_PASS="$KS_PASS"
          [ -z "$KEY_ALIAS" ] && KEY_ALIAS=upload
          echo "::add-mask::$KS_PASS"; echo "::add-mask::$KEY_PASS"
          clean "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks" || true
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Ključ iz GitHub secreta ne može da se otvori (pogrešna lozinka ili nepotpun ANDROID_KEYSTORE_BASE64). Ova verzija je potpisana probnim ključem."
            exit 0
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo "Potpisuje se ključem za Google Play."
      # Broj verzije raste sa svakim pokretanjem (Google Play traži veći broj za svaku novu verziju).
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Preimenuj
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/25slova.apk
          cp build/app/outputs/bundle/release/app-release.aab build/25slova.aab
      - uses: actions/upload-artifact@v4
        with:
          name: 25slova-apk
          path: mobile/build/25slova.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: 25slova-aab
          path: mobile/build/25slova.aab
          retention-days: 30
