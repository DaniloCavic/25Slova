# Pravi Android aplikaciju (APK) posle svake izmene.
# Preuzimanje: GitHub → Actions → poslednje "Android APK" pokretanje → Artifacts → 25slova-apk
name: Android APK

on:
  push:
    branches: [claude/mobile-game-serbian-a6err7]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Preimenuj APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/25slova.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 25slova-apk
          path: mobile/build/25slova.apk
          retention-days: 30
